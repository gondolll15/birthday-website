<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="ie=edge" />
  <title>Happy Birthday</title>

  <link rel="stylesheet" href="style.css" />

  <style>
    @import url("https://fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;400;500;600;700;800;900&display=swap");

    * {
      margin: 0;
      padding: 0;
      font-family: "Poppins", sans-serif;
      box-sizing: border-box;
    }

    body {
      overflow: hidden;
      height: 100vh;
      width: 100%;
      background: #000;
    }

    /* HALAMAN COUNTDOWN */
    .front {
      position: fixed;
      top: 0;
      left: 0;
      height: 100%;
      width: 100%;
      background:
        linear-gradient(rgba(0,0,0,0.65), rgba(0,0,0,0.88)),
        url("https://images.unsplash.com/photo-1519608487953-e999c86e7455?auto=format&fit=crop&w=1600&q=80");
      background-size: cover;
      background-position: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #fff;
      text-shadow: 0 0 15px #ff0000;
      z-index: 20;
    }

    .front .info {
      padding: 20px 15px;
      font-size: 4.5rem;
      font-weight: bolder;
      text-align: center;
    }

    .front .countdown {
      position: relative;
      font-size: 5.5rem;
      padding: 20px 15px;
    }

    .front .countdown h1 {
      display: none;
      opacity: 0;
    }

    .front .loader {
      position: relative;
      margin-top: 100px;
      width: 250px;
      height: 10px;
      border: 1px solid #fff;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 0 12px #ff0000;
    }

    .front .loader .fill {
      position: absolute;
      height: 100%;
      width: 0;
      background: #d00000;
      border-radius: 20px;
      animation: animate 10s linear forwards;
    }

    @keyframes animate {
      0% { width: 0; }
      100% { width: 100%; }
    }

    /* HALAMAN BIRTHDAY */
    .birthday {
      position: fixed;
      top: 0;
      left: 120%;
      height: 100%;
      width: 100%;
      background:
        radial-gradient(circle at center, #252525 0%, #080808 65%, #000 100%);
      display: flex;
      align-items: center;
      flex-direction: column;
      justify-content: center;
      color: #fff;
      text-shadow: 0 0 15px red;
      overflow: hidden;
    }

    /* EFEK SARANG LABA-LABA */
    .web-decoration {
      position: absolute;
      inset: 0;
      opacity: 0.16;
      pointer-events: none;
      background-image:
        repeating-radial-gradient(
          circle at top right,
          transparent 0,
          transparent 45px,
          #e32636 47px,
          transparent 49px
        );
      z-index: 0;
    }

    .birthday h1:nth-child(1) {
      font-size: 4.3rem;
      margin-left: 150%;
    }

    .birthday h1.year {
      font-size: 12.3rem;
      margin-top: 80%;
    }

    .birthday .greeting,
    .birthday .year {
      position: relative;
      z-index: 5;
    }

    /* SPIDERMAN */
    .spiderman {
      position: absolute;
      right: 2%;
      bottom: 0;
      height: 75vh;
      max-width: 48%;
      object-fit: contain;
      z-index: 3;
      pointer-events: none;
      filter: drop-shadow(0 0 20px rgba(255, 0, 0, 0.7));
      animation: spideyFloat 3s ease-in-out infinite;
    }

    @keyframes spideyFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-15px); }
    }

    /* PERCAKAPAN SPIDERMAN */
    .spiderman-talk {
      position: absolute;
      right: 29%;
      top: 30%;
      width: 250px;
      padding: 17px;
      background: #fff;
      color: #171717;
      border: 4px solid #e32636;
      border-radius: 22px;
      z-index: 6;
      text-align: center;
      transform: rotate(-3deg);
      box-shadow: 6px 7px 0 #8b111b;
      animation: talkFloat 2s ease-in-out infinite;
      text-shadow: none;
      overflow: visible;
    }

    .spiderman-talk::after {
      content: "";
      position: absolute;
      right: -18px;
      bottom: 20px;
      border-width: 12px 0 12px 18px;
      border-style: solid;
      border-color: transparent transparent transparent #fff;
    }

    .comic-title {
      display: block;
      font-size: 19px;
      font-weight: 900;
      color: #e32636;
    }

    .spiderman-talk p {
      font-size: 12px;
      font-weight: 700;
      line-height: 1.5;
      margin: 9px 0;
    }

    .comic-boom {
      display: inline-block;
      background: #e32636;
      color: white;
      padding: 5px 13px;
      font-weight: 900;
      font-size: 12px;
      transform: rotate(3deg);
    }

    @keyframes talkFloat {
      0%, 100% { translate: 0 0; }
      50% { translate: 0 -9px; }
    }

    /* KARAKTER KARTUN */
    .cartoon-friends {
      position: absolute;
      bottom: 12px;
      left: 8%;
      display: flex;
      justify-content: center;
      align-items: end;
      gap: 15px;
      z-index: 7;
    }

    .friend {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      animation: friendFloat 2.5s ease-in-out infinite;
    }

    .friend:nth-child(2) {
      animation-delay: .3s;
    }

    .friend:nth-child(3) {
      animation-delay: .6s;
    }

    .friend img {
      width: 95px;
      height: 115px;
      object-fit: contain;
      filter: drop-shadow(0 5px 8px #000);
    }

    .friend span {
      color: white;
      font-size: 10px;
      font-weight: 900;
      background: #e32636;
      padding: 4px 9px;
      border-radius: 10px;
      text-shadow: none;
    }

    @keyframes friendFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    /* TOMBOL */
    .buttons {
      display: flex;
      gap: 20px;
      margin-top: 20px;
      position: relative;
      z-index: 8;
    }

    .btn {
      padding: 15px 30px;
      font-size: 1.5rem;
      color: #fff;
      background: #b00000;
      border: 2px solid #fff;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.3s ease, background-color 0.3s ease;
      box-shadow: 0 0 12px red;
    }

    .btn:hover {
      transform: scale(1.05);
      background: #000;
      box-shadow: 0 0 20px red;
    }

    /* KEMBANG API */
    .firework {
      position: absolute;
      z-index: 9;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 0.5vmin;
      aspect-ratio: 1;
      background: transparent;
      background-size: 0.5vmin 0.5vmin;
      background-repeat: no-repeat;
      animation: firework 1s infinite;
      animation-delay: 14s;
    }

    @keyframes firework {
      0% {
        transform: translate(-50%, 60vh);
        width: 0.5vmin;
        opacity: 1;
      }
      50% {
        width: 0.5vmin;
        opacity: 1;
      }
      100% {
        width: 45vmin;
        opacity: 0;
      }
    }

    .firework::before,
    .firework::after {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 0.5vmin;
      aspect-ratio: 1;
      background:
        radial-gradient(circle, #fff 0.3vmin, #0000 0) 50% 0%,
        radial-gradient(circle, #fff 0.3vmin, #0000 0) 0% 50%,
        radial-gradient(circle, #ff0000 0.5vmin, #0000 0) 50% 99%,
        radial-gradient(circle, #fff 0.3vmin, #0000 0) 99% 50%,
        radial-gradient(circle, #ff0000 0.5vmin, #0000 0) 80% 90%,
        radial-gradient(circle, #fff 0.5vmin, #0000 0) 95% 90%,
        radial-gradient(circle, #ff0000 0.5vmin, #0000 0) 10% 60%,
        radial-gradient(circle, #fff 0.3vmin, #0000 0) 31% 80%,
        radial-gradient(circle, #fff 0.3vmin, #0000 0) 80% 10%,
        radial-gradient(circle, #ff0000 0.2vmin, #0000 0) 90% 23%,
        radial-gradient(circle, #fff 0.3vmin, #0000 0) 45% 20%;
      background-size: 0.5vmin 0.5vmin;
      background-repeat: no-repeat;
      opacity: 0;
      animation: firework 1s infinite;
      animation-delay: 14s;
    }

    .firework::before {
      transform: translate(-50%, -50%) rotate(25deg) !important;
    }

    .firework::after {
      transform: translate(-50%, -50%) rotate(-37deg) !important;
    }

    /* RESPONSIVE HP */
    @media only screen and (max-width: 600px) {
      .front .info {
        font-size: 2rem;
      }

      .front .countdown {
        font-size: 3rem;
      }

      .front .loader {
        margin-top: 50px;
        width: 200px;
        height: 8px;
      }

      .birthday h1:nth-child(1) {
        font-size: 2rem;
        margin-left: 120%;
      }

      .birthday h1.year {
        font-size: 6rem;
        margin-top: 50%;
      }

      .spiderman {
        height: 48vh;
        max-width: 75%;
        right: -5%;
        opacity: 0.85;
      }

      .spiderman-talk {
        right: 5%;
        top: 25%;
        width: 170px;
        padding: 10px;
      }

      .comic-title {
        font-size: 14px;
      }

      .spiderman-talk p {
        font-size: 10px;
      }

      .comic-boom {
        font-size: 10px;
      }

      .cartoon-friends {
        left: 5%;
        bottom: 8px;
        gap: 8px;
      }

      .friend img {
        width: 65px;
        height: 80px;
      }

      .friend span {
        font-size: 8px;
      }

      .buttons {
        gap: 10px;
        margin-top: 15px;
      }

      .btn {
        padding: 10px 18px;
        font-size: 1rem;
      }
    }

    /* RAPIIKAN TAMPILAN BIRTHDAY */
    .birthday {
      overflow: hidden;
      position: fixed;
    }

    /* JUDUL */
    .birthday .greeting {
      position: absolute;
      top: 13%;
      left: 8%;
      margin: 0 !important;
      font-size: clamp(2rem, 5vw, 4.3rem);
      z-index: 5;
    }

    .birthday .year {
      display: none;
    }

    /* SPIDERMAN */
    .spiderman {
      position: absolute;
      right: 2%;
      bottom: 5%;
      height: 65vh;
      max-width: 40%;
      object-fit: contain;
      z-index: 3;
    }

    /* BALON PERCAKAPAN */
    .spiderman-talk {
      position: absolute;
      top: 25%;
      right: 24%;
      width: 210px;
      padding: 12px;
      z-index: 6;
      transform: rotate(-2deg);
    }

    .spiderman-talk p {
      font-size: 11px;
      line-height: 1.4;
    }

    /* TOMBOL */
    .birthday .buttons {
      position: absolute;
      top: 38%;
      left: 8%;
      margin: 0;
      z-index: 10;
    }

    .birthday .btn {
      font-size: 1.1rem;
      padding: 12px 25px;
    }

    /* KARAKTER KARTUN */
    .cartoon-friends {
      position: absolute;
      left: 7%;
      bottom: 5%;
      display: flex;
      gap: 12px;
      z-index: 8;
    }

    .friend img {
      width: 85px;
      height: 100px;
      object-fit: contain;
    }

    /* RESPONSIVE */
    @media (max-width: 600px) {
      .birthday .greeting {
        top: 10%;
        left: 5%;
        font-size: 2rem;
      }

      .spiderman {
        height: 43vh;
        max-width: 65%;
        right: -5%;
        bottom: 15%;
      }

      .spiderman-talk {
        top: 25%;
        right: 5%;
        width: 155px;
        padding: 9px;
      }

      .spiderman-talk p {
        font-size: 9px;
      }

      .birthday .buttons {
        top: 45%;
        left: 5%;
      }

      .birthday .btn {
        font-size: .9rem;
        padding: 9px 14px;
      }

      .cartoon-friends {
        left: 5%;
        bottom: 3%;
        gap: 5px;
      }

      .friend img {
        width: 58px;
        height: 70px;
      }

      .friend span {
        font-size: 7px;
      }
    }

    /* RESPONSIVE LAPTOP, TABLET DAN HP */
    @media (min-width: 901px) {
      .birthday .greeting {
        top: 12%;
        left: 7%;
        font-size: 4rem;
      }

      .birthday .buttons {
        top: 38%;
        left: 8%;
      }

      .spiderman {
        height: 68vh;
        right: 2%;
      }

      .spiderman-talk {
        top: 24%;
        right: 25%;
        width: 220px;
      }

      .cartoon-friends {
        left: 7%;
        bottom: 3%;
      }
    }

    /* TABLET */
    @media (min-width: 601px) and (max-width: 900px) {
      .birthday .greeting {
        top: 12%;
        left: 5%;
        font-size: 3rem;
      }

      .birthday .buttons {
        top: 35%;
        left: 5%;
        gap: 10px;
      }

      .birthday .btn {
        font-size: 1rem;
        padding: 10px 18px;
      }

      .spiderman {
        height: 58vh;
        max-width: 48%;
        right: 0;
      }

      .spiderman-talk {
        top: 24%;
        right: 23%;
        width: 185px;
        padding: 12px;
      }

      .cartoon-friends {
        left: 4%;
        bottom: 3%;
        gap: 8px;
      }

      .friend img {
        width: 70px;
        height: 85px;
      }
    }

    /* HP */
    @media (max-width: 600px) {
      .front .info {
        font-size: 2rem;
      }

      .front .countdown {
        font-size: 3rem;
      }

      .front .loader {
        width: 190px;
        margin-top: 45px;
      }

      .birthday {
        padding: 10px;
      }

      .birthday .greeting {
        position: absolute;
        top: 9%;
        left: 0;
        width: 100%;
        text-align: center;
        font-size: clamp(1.7rem, 8vw, 2.5rem);
        margin: 0 !important;
      }

      /* Spider-Man di bagian kanan bawah */
      .spiderman {
        position: absolute;
        height: 40vh;
        max-width: 65%;
        right: -3%;
        bottom: 16%;
        opacity: 1;
      }

      /* Balon percakapan */
      .spiderman-talk {
        position: absolute;
        top: 23%;
        right: 4%;
        width: 155px;
        padding: 9px;
        border-width: 3px;
        border-radius: 15px;
      }

      .comic-title {
        font-size: 13px;
      }

      .spiderman-talk p {
        font-size: 9px;
        line-height: 1.4;
        margin: 6px 0;
      }

      .comic-boom {
        font-size: 9px;
        padding: 4px 8px;
      }

      /* Tombol di sebelah kiri */
      .birthday .buttons {
        position: absolute;
        top: 39%;
        left: 5%;
        display: flex;
        flex-direction: column;
        gap: 9px;
        margin: 0;
      }

      .birthday .btn {
        font-size: 0.95rem;
        padding: 9px 18px;
      }

      /* SpongeBob, Upin, Ipin */
      .cartoon-friends {
        position: absolute;
        left: 50%;
        bottom: 2%;
        transform: translateX(-50%);
        width: 95%;
        justify-content: center;
        gap: 8px;
      }

      .friend img {
        width: clamp(48px, 17vw, 68px);
        height: clamp(60px, 20vw, 82px);
      }

      .friend span {
        font-size: 7px;
        padding: 3px 6px;
      }

      .web-decoration {
        opacity: 0.10;
      }
    }

    /* HP KECIL */
    @media (max-width: 380px) {
      .birthday .greeting {
        font-size: 1.6rem;
      }

      .spiderman {
        height: 35vh;
        right: -5%;
      }

      .spiderman-talk {
        width: 140px;
        right: 3%;
        top: 22%;
      }

      .birthday .buttons {
        top: 40%;
        left: 4%;
      }

      .birthday .btn {
        font-size: 0.85rem;
        padding: 8px 12px;
      }

      .cartoon-friends {
        gap: 4px;
      }

      .friend img {
        width: 48px;
        height: 60px;
      }

      .friend span {
        font-size: 6px;
      }
    }

    /* HP LANDSCAPE */
    @media (max-height: 500px) and (orientation: landscape) {
      .birthday .greeting {
        top: 5%;
        left: 5%;
        font-size: 2rem;
      }

      .spiderman {
        height: 70vh;
        right: 2%;
      }

      .spiderman-talk {
        top: 20%;
        right: 25%;
        width: 170px;
      }

      .birthday .buttons {
        top: 48%;
        left: 5%;
      }

      .cartoon-friends {
        bottom: 1%;
        left: 5%;
      }

      .friend img {
        width: 45px;
        height: 50px;
      }
    }

    /* FOTO POLAROID LEBIH KECIL DI HP */
    @media (max-width: 700px) {
      .memory-wall {
        width: 100%;
        max-width: 310px;
        margin: 0 auto;
        padding: 8px;
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
        justify-items: center;
      }

      .polaroid {
        width: 100%;
        max-width: 135px;
        padding: 5px 5px 8px;
        margin: 0;
      }

      .polaroid img {
        width: 100%;
        height: 105px;
        object-fit: cover;
      }

      .polaroid p {
        font-size: 9px;
        margin-top: 5px;
      }
    }

    /* HP KECIL */
    @media (max-width: 380px) {
      .memory-wall {
        max-width: 270px;
        gap: 7px;
      }

      .polaroid {
        max-width: 118px;
      }

      .polaroid img {
        height: 90px;
      }

      .polaroid p {
        font-size: 8px;
      }
    }
  </style>
</head>

<body>

  <!-- COUNTDOWN -->
  <div class="front">
    <p class="info">Are You Ready?</p>

    <div class="countdown">
      <h1 class="three">3</h1>
      <h1 class="two">2</h1>
      <h1 class="one">1</h1>
    </div>

    <div class="loader">
      <div class="fill"></div>
    </div>
  </div>

  <!-- HALAMAN ULANG TAHUN -->
  <div class="birthday">

    <div class="web-decoration"></div>

    <h1 class="greeting">Happy Birthday</h1>
    <h1 class="year"></h1>

    <!-- SPIDERMAN -->
    <img
      class="spiderman"
      src="spiderman.png"
      alt="Spider-Man"
    />

    <!-- TEKS PERCAKAPAN SPIDERMAN -->
    <div class="spiderman-talk">
      <span class="comic-title">HEY, YOU! 🕷️</span>
      <p>
        Yo! Someone special is having a birthday today!
        Are you ready for the biggest surprise?
      </p>
      <span class="comic-boom">LET'S GO!</span>
    </div>

    <!-- SPONGEBOB DAN UPIN -->
    <div class="cartoon-friends">

      <div class="friend">
        <img src="spo.png" alt="SpongeBob" />
      </div>

      <div class="friend">
        <img src="ip.png" alt="Upin" />
      </div>

    </div>

    <!-- TOMBOL -->
    <div class="buttons">
      <button
        class="btn"
        type="button"
        onclick="window.location.href='halaman1.html'">
        Next
      </button>

      <button
        class="btn"
        type="button"
        onclick="window.location.href='flowers.html'">
        Surprise
      </button>
    </div>

    <!-- FIREWORKS -->
    <div class="firework"></div>
    <div class="firework"></div>
    <div class="firework"></div>
    <div class="firework"></div>
    <div class="firework"></div>
    <div class="firework"></div>
    <div class="firework"></div>
    <div class="firework"></div>
    <div class="firework"></div>
    <div class="firework"></div>

  </div>

  <!-- GSAP -->
  <script
    src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.11.4/gsap.min.js"
    integrity="sha512-f8mwTB+Bs8a5c46DEm7HQLcJuHMBaH/UFlcgyetMqqkvTcYg4g5VXsYR71b3qC82lZytjNYvBj2pf0VekA9/FQ=="
    crossorigin="anonymous"
    referrerpolicy="no-referrer">
  </script>

  <script>
    window.onload = () => {

      gsap.to(".info", {
        opacity: 0,
        display: "none",
        duration: 1,
        delay: 6
      });

      gsap.to("h1.three", {
        opacity: 1,
        display: "block",
        duration: 0.5,
        delay: 7
      });

      gsap.to("h1.three", {
        opacity: 0,
        display: "none",
        duration: 0.5,
        delay: 7.5
      });

      gsap.to("h1.two", {
        opacity: 1,
        display: "block",
        duration: 0.5,
        delay: 8
      });

      gsap.to("h1.two", {
        opacity: 0,
        display: "none",
        duration: 0.5,
        delay: 8.5
      });

      gsap.to("h1.one", {
        opacity: 1,
        display: "block",
        duration: 0.5,
        delay: 9
      });

      gsap.to("h1.one", {
        opacity: 0,
        display: "none",
        duration: 0.5,
        delay: 9.5
      });

      gsap.to(".loader", {
        opacity: 0,
        display: "none",
        duration: 0.5,
        delay: 10
      });

      gsap.to(".front", {
        left: "-100%",
        duration: 1.2,
        delay: 10.5,
        ease: "power2.inOut"
      });

      gsap.to(".birthday", {
        left: "0",
        duration: 1,
        delay: 10.7,
        ease: "power2.inOut"
      });

      gsap.to("h1.greeting", {
        marginLeft: "0",
        duration: 1.5,
        delay: 11.3,
        ease: "power2.inOut"
      });

      gsap.to("h1.year", {
        marginTop: "0",
        duration: 2.5,
        delay: 12,
        ease: "power2.inOut"
      });

      /* POSISI FIREWORK BERUBAH ACAK */
      const fireworks = document.querySelectorAll(".firework");

      setInterval(() => {
        fireworks.forEach((firework) => {
          firework.style.top =
            `${Math.random() * window.innerHeight}px`;

          firework.style.left =
            `${Math.random() * window.innerWidth}px`;
        });
      }, 1000);

    };
  </script>

</body>
</html>
